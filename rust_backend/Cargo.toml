[package]
name = "phonepicker-server"
version = "0.1.0"
edition = "2021"
description = "Быстрый подбор смартфона: Rust-бэкенд для моделей, обученных в Python"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
